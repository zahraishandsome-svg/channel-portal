name: Probe channel status

# Publishes status.json so the portal can tell a TERMINATED channel apart from one
# that is simply too new for the YouTube Data API to have indexed. The channel list
# comes from an encrypted repository secret and the output is keyed by SHA-256, so
# no channel ID is ever committed to this public repo.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe each channel page
        env:
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request

          ids = [x.strip() for x in os.environ.get("CHANNEL_IDS", "").split(",") if x.strip()]
          if not ids:
              raise SystemExit("CHANNEL_IDS secret is empty — nothing to probe")

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/133.0.0.0 Safari/537.36")

          def probe(cid):
              req = urllib.request.Request(
                  f"https://www.youtube.com/channel/{cid}",
                  headers={"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      html = r.read().decode("utf-8", "ignore")
              except urllib.error.HTTPError as e:
                  return {"status": "missing"} if e.code == 404 else {"status": "unknown"}
              except Exception:
                  return {"status": "unknown"}

              if "has been terminated" in html:
                  return {"status": "terminated"}
              i, j = html.find("<title>"), html.find("</title>")
              title = html[i + 7:j].replace(" - YouTube", "").strip() if 0 <= i < j else ""
              if title and title.lower() != "youtube":
                  # renders with a real name -> alive, the Data API is just behind
                  return {"status": "indexing", "title": title}
              return {"status": "missing"}

          out = {}
          for cid in ids:
              out[hashlib.sha256(cid.encode()).hexdigest()] = probe(cid)
              time.sleep(1.5)          # be gentle with youtube.com
          out["_checked"] = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

          with open("status.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=1)
          print(json.dumps({k[:8] + "…": v for k, v in out.items() if k != "_checked"}, indent=1))
          PY

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- status.json; then
            echo "no change"
          else
            git add status.json
            git commit -m "chore: refresh channel status [skip ci]"
            git push
          fi
